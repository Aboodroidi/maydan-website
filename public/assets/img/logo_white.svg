<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#000000"/>
  <g transform="translate(300,300)">
    <!-- M shape: two angled strokes meeting at center top, with vertical sides -->
    <path d="
      M -160,-180
      L -160,180
      L -110,180
      L -110,-100
      L 0,-10
      L 110,-100
      L 110,180
      L 160,180
      L 160,-180
      L 0,-20
      Z
    " fill="#FFFFFF"/>
    <!-- Ball/circle element centered below the V -->
    <circle cx="0" cy="120" r="38" fill="#FFFFFF"/>
  </g>
</svg>